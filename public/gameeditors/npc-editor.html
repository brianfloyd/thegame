<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC Editor - The Game</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/css/editor-core.css">
    <link rel="stylesheet" href="/gameeditors/editor-shared.css">
</head>
<body>
    <div id="npcEditor" class="editor-container npc-editor" x-data="npcEditor()" x-init="init()">
        
        <!-- Header -->
        <div class="editor-header">
            <div class="editor-header-left">
                <h2>NPC Editor</h2>
                <div class="editor-nav-buttons">
                    <button class="editor-nav-btn" @click="navigateTo('/map')">Map</button>
                    <button class="editor-nav-btn" @click="navigateTo('/items')">Item</button>
                    <button class="editor-nav-btn" @click="navigateTo('/player')">Player</button>
                    <button class="editor-nav-btn" @click="navigateTo('/crafting')">Crafting</button>
                    <button class="editor-nav-btn" @click="navigateTo('/tickets')">Tickets</button>
                    <button class="editor-nav-btn" @click="navigateTo('/markup')">Markup</button>
                    <button class="editor-nav-btn" @click="navigateTo('/formulas')">Formulas</button>
                </div>
            </div>
            <div class="editor-header-right">
                <button class="editor-btn editor-btn-success" @click="saveNpc()" :disabled="(!selectedNpc && !isCreating) || loading">Save</button>
                <button class="close-editor-btn" @click="navigateTo('/game.html')">Close</button>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="editor-toolbar">
            <div class="toolbar-filters">
                <select class="editor-select" x-model="filters.type" @change="applyFilter()">
                    <option value="all">All Types</option>
                    <option value="scriptable">Scriptable NPC</option>
                    <option value="lorekeeper">Lorekeeper</option>
                </select>
                <label class="checkbox-label">
                    <input type="checkbox" x-model="filters.harvestableOnly" @change="applyFilter()">
                    <span>Harvestable Only</span>
                </label>
                <input type="text" class="editor-input search-input" placeholder="Search NPCs..." x-model="filters.search" @input="applyFilter()">
            </div>
            <div class="toolbar-actions">
                <button class="editor-btn" @click="loadNpcs()" :disabled="loading">
                    <span x-show="!loading">↻ Refresh</span>
                    <span x-show="loading">Loading...</span>
                </button>
                <button class="editor-btn editor-btn-primary" @click="createNpc()">+ New NPC</button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="editor-content">
            
            <!-- Left: NPC List -->
            <div class="editor-list-pane">
                <div class="list-header">
                    <span class="list-count" x-text="'NPCs: ' + filteredNpcs.length"></span>
                </div>
                <div class="editor-list">
                    <template x-for="npc in filteredNpcs" :key="npc.id">
                        <div class="editor-list-item" 
                             :class="{ 'selected': selectedNpc && selectedNpc.id === npc.id, 'inactive': !npc.active }"
                             @click="selectNpc(npc)">
                            <div class="editor-list-header">
                                <span class="editor-id" x-text="'#' + npc.id"></span>
                                <span class="editor-badge blue" x-text="getNpcTypeLabel(npc.npc_type)"></span>
                                <span class="editor-status" :class="npc.active ? 'active' : 'inactive'" x-text="npc.active ? 'Active' : 'Inactive'"></span>
                            </div>
                            <div class="editor-list-title" x-text="npc.name"></div>
                            <div class="npc-color-preview" :style="'background-color: ' + npc.display_color"></div>
                        </div>
                    </template>
                    <div class="empty-list" x-show="filteredNpcs.length === 0">
                        <span x-show="loading">Loading NPCs...</span>
                        <span x-show="!loading">No NPCs found matching filters.</span>
                    </div>
                </div>
            </div>

            <!-- Right: NPC Form -->
            <div class="editor-detail-pane">
                <template x-if="!selectedNpc && !isCreating">
                    <div class="empty-detail">
                        <p>Select an NPC or click "+ New NPC" to create one.</p>
                    </div>
                </template>

                <template x-if="selectedNpc || isCreating">
                    <div class="editor-form">
                        <!-- Actions -->
                        <div class="form-actions">
                            <template x-if="selectedNpc && !isCreating">
                                <button class="editor-btn editor-btn-danger" @click="deleteNpc()" :disabled="loading">Delete</button>
                            </template>
                        </div>

                        <!-- Tabs -->
                        <div class="editor-tabs">
                            <button class="editor-tab" :class="{ 'active': activeTab === 'basic' }" @click="activeTab = 'basic'">Basic</button>
                            <button class="editor-tab" 
                                    :class="{ 'active': activeTab === 'timing' }" 
                                    @click="activeTab = 'timing'"
                                    x-show="!selectedNpc || selectedNpc.npc_type !== 'lorekeeper'">Timing</button>
                            <button class="editor-tab" 
                                    :class="{ 'active': activeTab === 'output' }" 
                                    @click="activeTab = 'output'"
                                    x-show="!selectedNpc || selectedNpc.npc_type !== 'lorekeeper'">Output</button>
                            <button class="editor-tab" 
                                    :class="{ 'active': activeTab === 'lorekeeper' }" 
                                    @click="activeTab = 'lorekeeper'"
                                    x-show="selectedNpc && selectedNpc.npc_type === 'lorekeeper'">Lorekeeper</button>
                            <button class="editor-tab" 
                                    :class="{ 'active': activeTab === 'history' }" 
                                    @click="activeTab = 'history'"
                                    x-show="selectedNpc && selectedNpc.npc_type === 'lorekeeper'">History</button>
                        </div>

                        <!-- Basic Tab -->
                        <div class="tab-content" 
                             :class="{ 'active': activeTab === 'basic' }"
                             x-show="activeTab === 'basic'">
                            <div class="form-section">
                                <div class="section-header">Basic Information</div>
                                <div class="form-grid">
                                    <div class="form-field span-2">
                                        <label>Name *</label>
                                        <input type="text" class="editor-input" x-model="formData.name" placeholder="NPC name">
                                    </div>
                                    <div class="form-field">
                                        <label>NPC Type</label>
                                        <select class="editor-select" x-model="formData.npc_type">
                                            <option value="">Select type...</option>
                                            <template x-for="type in npcTypes" :key="type">
                                                <option :value="type" x-text="type"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Description *</label>
                                        <textarea class="editor-textarea" x-model="formData.description" rows="3" placeholder="NPC description..."></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">Display & State</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Display Color</label>
                                        <input type="color" class="editor-input color-input" x-model="formData.display_color">
                                    </div>
                                    <div class="form-field">
                                        <label>Active</label>
                                        <select class="editor-select" x-model="formData.active">
                                            <option :value="true">Active</option>
                                            <option :value="false">Inactive</option>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>Scriptable</label>
                                        <label class="toggle-switch">
                                            <input type="checkbox" x-model="formData.scriptable">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-label" x-text="formData.scriptable ? 'Yes' : 'No'"></span>
                                        </label>
                                    </div>
                                    <div class="form-field">
                                        <label>Difficulty</label>
                                        <input type="number" class="editor-input" x-model="formData.difficulty" min="1">
                                    </div>
                                    <div class="form-field">
                                        <label>Pulse Echo Yield</label>
                                        <input type="number" class="editor-input" x-model="formData.pulse_echo_yield" min="0">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Timing Tab -->
                        <div class="tab-content" 
                             :class="{ 'active': activeTab === 'timing' }"
                             x-show="activeTab === 'timing' && (!selectedNpc || selectedNpc.npc_type !== 'lorekeeper')">
                            <div class="form-section">
                                <div class="section-header">Timing Configuration</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Base Cycle Time (ms)</label>
                                        <input type="number" class="editor-input" x-model="formData.base_cycle_time" min="0" step="1000">
                                    </div>
                                    <div class="form-field">
                                        <label>Harvestable Time (ms)</label>
                                        <input type="number" class="editor-input" x-model="formData.harvestable_time" min="0" step="1000">
                                    </div>
                                    <div class="form-field">
                                        <label>Cooldown Time (ms)</label>
                                        <input type="number" class="editor-input" x-model="formData.cooldown_time" min="0" step="1000">
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">NPC Status</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Status Message Idle</label>
                                        <input type="text" class="editor-input" x-model="formData.status_message_idle" placeholder="(idle)">
                                    </div>
                                    <div class="form-field">
                                        <label>Status Message Ready</label>
                                        <input type="text" class="editor-input" x-model="formData.status_message_ready" placeholder="(ready)">
                                    </div>
                                    <div class="form-field">
                                        <label>Status Message Harvesting</label>
                                        <input type="text" class="editor-input" x-model="formData.status_message_harvesting" placeholder="(harvesting)">
                                    </div>
                                    <div class="form-field">
                                        <label>Status Message Cooldown</label>
                                        <input type="text" class="editor-input" x-model="formData.status_message_cooldown" placeholder="(cooldown)">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Output Tab -->
                        <div class="tab-content" 
                             :class="{ 'active': activeTab === 'output' }"
                             x-show="activeTab === 'output' && (!selectedNpc || selectedNpc.npc_type !== 'lorekeeper')">
                            <div class="form-section">
                                <div class="section-header">
                                    <span>Output Items</span>
                                </div>
                                
                                <!-- Add Output Item Section -->
                                <div class="inventory-add-section">
                                    <div class="form-grid">
                                        <div class="form-field">
                                            <label>Item</label>
                                            <select class="editor-select" x-model="newOutputItem.itemName">
                                                <option value="">Select item...</option>
                                                <template x-for="item in allItems" :key="item.id">
                                                    <option :value="item.name" x-text="item.name"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <div class="form-field">
                                            <label>Quantity</label>
                                            <input type="number" class="editor-input" x-model="newOutputItem.quantity" min="1" value="1">
                                        </div>
                                        <div class="form-field">
                                            <label>Chance (0-1)</label>
                                            <input type="number" class="editor-input" x-model="newOutputItem.chance" min="0" max="1" step="0.1" value="1.0">
                                        </div>
                                        <div class="form-field">
                                            <label>&nbsp;</label>
                                            <button class="editor-btn editor-btn-success" 
                                                    @click="addOutputItem()" 
                                                    :disabled="!newOutputItem.itemName || loading">
                                                + Add Item
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Output Items List -->
                                <div class="inventory-list">
                                    <template x-for="(item, index) in formData.output_items" :key="index">
                                        <div class="inventory-item-row">
                                            <div class="inventory-item-info">
                                                <span class="inventory-item-name" x-text="item.item_name"></span>
                                                <span class="inventory-item-quantity" x-text="'Qty: ' + item.quantity"></span>
                                                <span class="inventory-item-quantity" x-text="'Chance: ' + item.chance"></span>
                                            </div>
                                            <div class="inventory-item-actions">
                                                <button class="editor-btn editor-btn-danger" 
                                                        @click="removeOutputItem(index)"
                                                        :disabled="loading">
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="empty-list" x-show="!formData.output_items || formData.output_items.length === 0">
                                        No output items configured.
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">Output Distribution</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Distribution Method</label>
                                        <label class="toggle-switch">
                                            <input type="checkbox" 
                                                   :checked="formData.output_distribution === 'player'"
                                                   @change="formData.output_distribution = $event.target.checked ? 'player' : 'ground'">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-label" x-text="formData.output_distribution === 'player' ? 'Player' : 'Ground'"></span>
                                        </label>
                                        <div class="toggle-description" x-text="formData.output_distribution === 'player' ? 'Items go to player inventory' : 'Items drop on the ground'"></div>
                                    </div>
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">
                                    <span>Harvest Prerequisites</span>
                                </div>
                                
                                <!-- Add Harvest Prerequisite Section -->
                                <div class="inventory-add-section">
                                    <div class="form-grid">
                                        <div class="form-field">
                                            <label>Item</label>
                                            <select class="editor-select" x-model="newHarvestPrerequisite.itemName">
                                                <option value="">Select item...</option>
                                                <template x-for="item in allItems" :key="item.id">
                                                    <option :value="item.name" x-text="item.name"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <div class="form-field">
                                            <label>&nbsp;</label>
                                            <button class="editor-btn editor-btn-success" 
                                                    @click="addHarvestPrerequisite()" 
                                                    :disabled="!newHarvestPrerequisite.itemName || loading">
                                                + Add Item
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <!-- Harvest Prerequisites List -->
                                <div class="inventory-list">
                                    <template x-for="(item, index) in formData.harvest_prerequisite_items" :key="index">
                                        <div class="inventory-item-row">
                                            <div class="inventory-item-info">
                                                <span class="inventory-item-name" x-text="item.item_name"></span>
                                            </div>
                                            <div class="inventory-item-actions">
                                                <button class="editor-btn editor-btn-danger" 
                                                        @click="removeHarvestPrerequisite(index)"
                                                        :disabled="loading">
                                                    Remove
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="empty-list" x-show="!formData.harvest_prerequisite_items || formData.harvest_prerequisite_items.length === 0">
                                        No harvest prerequisites configured.
                                    </div>
                                </div>
                                
                                <div class="form-field" style="margin-top: 15px;">
                                    <label>Prerequisite Message</label>
                                    <input type="text" class="editor-input" x-model="formData.harvest_prerequisite_message" 
                                           placeholder="Message shown when prerequisite is missing">
                                </div>
                            </div>

                            <div class="form-section">
                                <div class="section-header">Failure States (JSON)</div>
                                <div class="form-field">
                                    <textarea class="editor-textarea json-input" 
                                              :value="JSON.stringify(formData.failure_states, null, 2)"
                                              @input="handleJsonInput('failure_states', $event.target.value)"
                                              rows="3" 
                                              placeholder='["exhausted", "damaged"]'></textarea>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Lorekeeper Tab -->
                        <div class="tab-content" 
                             :class="{ 'active': activeTab === 'lorekeeper' }"
                             x-show="activeTab === 'lorekeeper' && selectedNpc && selectedNpc.npc_type === 'lorekeeper'">
                            
                            <!-- Engagement Section -->
                            <div class="form-section">
                                <div class="section-header">Engagement</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Engagement Enabled</label>
                                        <label class="toggle-switch">
                                            <input type="checkbox" x-model="lorekeeperData.engagement_enabled">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-label" x-text="lorekeeperData.engagement_enabled ? 'Yes' : 'No'"></span>
                                        </label>
                                    </div>
                                    <div class="form-field">
                                        <label>Engagement Delay (ms)</label>
                                        <input type="number" class="editor-input" x-model="lorekeeperData.engagement_delay" min="0" step="1000">
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Initial Message</label>
                                        <textarea class="editor-textarea" 
                                                  x-model="lorekeeperData.initial_message" 
                                                  rows="5" 
                                                  placeholder="Message sent when player enters room..."></textarea>
                                    </div>
                                    <div class="form-field">
                                        <label>Initial Message Color</label>
                                        <input type="color" class="editor-input" x-model="lorekeeperData.initial_message_color">
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Lore Type Selection -->
                            <div class="form-section">
                                <div class="section-header">Lore Type</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Lore Type</label>
                                        <select class="editor-select" x-model="lorekeeperData.lore_type">
                                            <option value="dialogue">Dialogue</option>
                                            <option value="puzzle">Puzzle</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Dialogue Fields -->
                            <div class="form-section" x-show="lorekeeperData.lore_type === 'dialogue'">
                                <div class="section-header">Dialogue Configuration</div>
                                <div class="form-grid">
                                    <div class="form-field span-3">
                                        <label>Keywords/Responses (JSON)</label>
                                        <textarea class="editor-textarea json-input" 
                                                  :value="JSON.stringify(lorekeeperData.keywords_responses, null, 2)"
                                                  @input="handleLorekeeperJsonInput('keywords_responses', $event.target.value)"
                                                  rows="6" 
                                                  placeholder='{"keyword": "response", "help": "I can help with..."}'></textarea>
                                    </div>
                                    <div class="form-field">
                                        <label>Keyword Color</label>
                                        <input type="color" class="editor-input" x-model="lorekeeperData.keyword_color">
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Incorrect Response</label>
                                        <input type="text" class="editor-input" x-model="lorekeeperData.incorrect_response" 
                                               placeholder="Response when no keyword matches">
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Puzzle Fields -->
                            <div class="form-section" x-show="lorekeeperData.lore_type === 'puzzle'">
                                <div class="section-header">Puzzle Configuration</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <label>Puzzle Mode</label>
                                        <select class="editor-select" x-model="lorekeeperData.puzzle_mode">
                                            <option value="">Select mode...</option>
                                            <option value="word">Word</option>
                                            <option value="combination">Combination</option>
                                            <option value="cipher">Cipher</option>
                                        </select>
                                    </div>
                                    <div class="form-field span-2">
                                        <label>Puzzle Solution</label>
                                        <input type="text" class="editor-input" x-model="lorekeeperData.puzzle_solution" 
                                               placeholder="The answer to the puzzle">
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Puzzle Clues (keyword:answer pairs)</label>
                                        <textarea class="editor-textarea json-input" 
                                                  :value="lorekeeperData.puzzle_clues ? JSON.stringify(lorekeeperData.puzzle_clues, null, 2) : '{}'"
                                                  @input="handleLorekeeperJsonInput('puzzle_clues', $event.target.value)"
                                                  rows="6" 
                                                  placeholder='{"resin": "This is the stuff that holds pulse resin together", "pulse": "The energy that flows through all things"}'></textarea>
                                        <div style="font-size: 11px; color: #888; margin-top: 5px;">
                                            Format: {"keyword": "answer text", "keyword2": "answer text 2"} (stored as array in database)
                                        </div>
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Puzzle Success Message</label>
                                        <textarea class="editor-textarea" 
                                                  x-model="lorekeeperData.puzzle_success_message" 
                                                  rows="4" 
                                                  placeholder="Message shown when puzzle is solved correctly..."></textarea>
                                    </div>
                                    <div class="form-field span-3">
                                        <label>Puzzle Failure Message</label>
                                        <textarea class="editor-textarea" 
                                                  x-model="lorekeeperData.puzzle_failure_message" 
                                                  rows="3" 
                                                  placeholder="Message shown when puzzle answer is incorrect..."></textarea>
                                    </div>
                                    <div class="form-field">
                                        <label>Puzzle Reward Item</label>
                                        <select class="editor-select" x-model="lorekeeperData.puzzle_reward_item">
                                            <option value="">No reward</option>
                                            <template x-for="item in allItems" :key="item.id">
                                                <option :value="item.name" x-text="item.name"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="form-field">
                                        <label>Award Once Only</label>
                                        <label class="toggle-switch">
                                            <input type="checkbox" x-model="lorekeeperData.puzzle_award_once_only">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-label" x-text="lorekeeperData.puzzle_award_once_only ? 'Yes' : 'No'"></span>
                                        </label>
                                    </div>
                                    <div class="form-field">
                                        <label>Award After Delay</label>
                                        <label class="toggle-switch">
                                            <input type="checkbox" x-model="lorekeeperData.puzzle_award_after_delay">
                                            <span class="toggle-slider"></span>
                                            <span class="toggle-label" x-text="lorekeeperData.puzzle_award_after_delay ? 'Yes' : 'No'"></span>
                                        </label>
                                    </div>
                                    <div class="form-field" x-show="lorekeeperData.puzzle_award_after_delay">
                                        <label>Award Delay Seconds</label>
                                        <input type="number" class="editor-input" x-model="lorekeeperData.puzzle_award_delay_seconds" min="0">
                                    </div>
                                    <div class="form-field span-3" x-show="lorekeeperData.puzzle_award_after_delay">
                                        <label>Award Delay Response</label>
                                        <textarea class="editor-textarea" 
                                                  x-model="lorekeeperData.puzzle_award_delay_response" 
                                                  rows="2" 
                                                  placeholder="Message shown during delay before awarding item..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- History Tab -->
                        <div class="tab-content" 
                             :class="{ 'active': activeTab === 'history' }"
                             x-show="activeTab === 'history' && selectedNpc && selectedNpc.npc_type === 'lorekeeper'">
                            
                            <!-- Greetings Section -->
                            <div class="form-section">
                                <div class="section-header">
                                    <span>Player Greetings</span>
                                    <button class="editor-btn editor-btn-danger" 
                                            @click="clearLoreKeeperHistory(true, false)"
                                            :disabled="loading">
                                        Clear All Greetings
                                    </button>
                                </div>
                                <div class="inventory-list">
                                    <template x-for="greeting in lorekeeperHistory.greetings" :key="greeting.id">
                                        <div class="inventory-item-row">
                                            <div class="inventory-item-info">
                                                <span class="inventory-item-name" x-text="greeting.player_name"></span>
                                                <span class="inventory-item-quantity" x-text="'First: ' + formatDate(greeting.first_greeted_at)"></span>
                                                <span class="inventory-item-quantity" x-text="'Last: ' + formatDate(greeting.last_greeted_at)"></span>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="empty-list" x-show="!lorekeeperHistory.greetings || lorekeeperHistory.greetings.length === 0">
                                        No players have been greeted yet.
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Item Awards Section -->
                            <div class="form-section">
                                <div class="section-header">
                                    <span>Item Awards</span>
                                    <button class="editor-btn editor-btn-danger" 
                                            @click="clearLoreKeeperHistory(false, true)"
                                            :disabled="loading">
                                        Clear All Awards
                                    </button>
                                </div>
                                <div class="inventory-list">
                                    <template x-for="award in lorekeeperHistory.itemAwards" :key="award.id">
                                        <div class="inventory-item-row">
                                            <div class="inventory-item-info">
                                                <span class="inventory-item-name" x-text="award.player_name"></span>
                                                <span class="inventory-item-quantity" x-text="'Item: ' + award.item_name"></span>
                                                <span class="inventory-item-quantity" x-text="'Awarded: ' + formatDate(award.awarded_at)"></span>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="empty-list" x-show="!lorekeeperHistory.itemAwards || lorekeeperHistory.itemAwards.length === 0">
                                        No items have been awarded yet.
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Clear All Section -->
                            <div class="form-section">
                                <div class="section-header">Clear All History</div>
                                <div class="form-grid">
                                    <div class="form-field">
                                        <button class="editor-btn editor-btn-danger" 
                                                @click="clearLoreKeeperHistory(true, true)"
                                                :disabled="loading">
                                            Clear All History (Greetings + Awards)
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Notification -->
        <div class="editor-notification" x-show="notification.show" x-text="notification.message"
             :class="{ 'notification-error': notification.type === 'error', 'notification-success': notification.type === 'success' }">
        </div>
    </div>

    <!-- Load editor module first, then Alpine.js -->
    <script type="module">
        await import('/npc-editor.js');
        console.log('[NPCEditor] Module loaded, npcEditor available:', typeof window.npcEditor);
        
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js';
        document.head.appendChild(script);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Game</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/widget-shared.css">
</head>
<body>
    <!-- Game View Screen -->
    <div id="gameView" class="screen">
        <div class="game-layout">
            <!-- Left: Text Terminal (2/3 of screen) -->
            <div class="terminal-container">
                <div class="terminal" id="terminal">
                    <div class="terminal-content" id="terminalContent">
                        <!-- Room info and players will be displayed here -->
                    </div>
                    <!-- Dynamic room status (items on ground - updates in place) -->
                    <div id="roomStatusBar" class="room-status-bar">
                        <span class="room-status-label">On the ground:</span>
                        <span id="roomItemsDisplay" class="room-items-display">Nothing</span>
                    </div>
                    <div class="command-line">
                        <span id="vitalisCounter" class="vitalis-counter">[50 / 100]</span>
                        <span class="prompt">&gt;</span>
                        <input type="text" id="commandInput" class="command-input" autocomplete="off" spellcheck="false" placeholder="Type a command...">
                        <button id="zorkBtn" class="zork-icon hidden" title="ZORK Interface (click to manage tickets)" style="display: none;">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <text x="12" y="18" font-size="16" font-weight="bold" text-anchor="middle" fill="currentColor">Z</text>
                            </svg>
                        </button>
                        <button id="micBtn" class="mic-icon" title="Voice Input (click to record)">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                            </svg>
                        </button>
                        <button id="scrollLockBtn" class="scroll-lock-icon" title="Lock/Unlock Scroll">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM12 17c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right: Widget Panel (1/3 of screen) -->
            <div class="right-panel">
                <!-- Widget Host - WidgetManager will dynamically create widgets here -->
                <div id="widget-host"></div>
                
                <!-- Exit button (moved to top bar by WidgetManager) -->
                <button class="widget-exit-btn" id="exitToCharacterSelection" title="Return to Character Selection">
                    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
                </button>
                
                <!-- All widgets are now dynamically created by WidgetManager -->
            </div>
        </div>
    </div>
    
    <!-- Auto-Path Panel -->
    <div id="autoPathPanel" class="auto-path-panel hidden">
        <div class="auto-path-container">
            <div class="auto-path-header">
                <h3>Auto-Path to Destination</h3>
                <button id="closeAutoPathPanel" class="auto-path-close">×</button>
            </div>
            <div class="auto-path-toolbar">
                <select id="autoPathMapSelect" class="auto-path-map-selector">
                    <option value="">Select a map...</option>
                </select>
            </div>
            <div class="auto-path-content">
                <canvas id="autoPathMapCanvas"></canvas>
            </div>
            <div class="auto-path-info">
                <span id="autoPathHoverInfo">Select a map, then click a room to set destination</span>
            </div>
            <div id="autoPathSummary" class="auto-path-summary" style="display: none;">
                <div class="auto-path-summary-title">Path Summary</div>
                <div id="autoPathSteps" class="auto-path-steps"></div>
                <button id="autoPathGoBtn" class="auto-path-go-btn">GO</button>
            </div>
        </div>
    </div>

    <!-- Jump Widget (God Mode only) -->
    <div id="jumpWidget" class="jump-widget-overlay hidden">
        <div class="jump-widget-container">
            <div class="jump-widget-header">
                <h3>Jump to Location</h3>
                <button id="closeJumpWidget" class="jump-widget-close">×</button>
            </div>
            <div class="jump-widget-toolbar">
                <select id="jumpMapSelector" class="jump-map-selector">
                    <option value="">Select a map...</option>
                </select>
            </div>
            <div class="jump-widget-content">
                <canvas id="jumpMapCanvas"></canvas>
            </div>
            <div class="jump-widget-info">
                <span id="jumpHoverInfo">Click a room to teleport</span>
            </div>
        </div>
    </div>

    <!-- Path Name Input Modal -->
    <div id="pathNameModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close" id="closePathNameModal">&times;</span>
            <h2 style="color: #667eea; margin-bottom: 20px;">Save Path</h2>
            <p style="color: #666; margin-bottom: 20px;" id="pathNameModalType"></p>
            <div id="pathNameForm">
                <input type="text" id="pathNameInput" placeholder="Path name" required 
                       style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin-bottom: 15px;">
                <div id="pathNameError" class="error-message"></div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button id="savePathBtn" class="auth-btn" style="flex: 1;">Save</button>
                    <button id="cancelPathNameBtn" class="auth-btn" style="flex: 1; background: #999;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ZORK Ticket Creation Dialog -->
    <div id="zorkTicketDialog" class="zork-ticket-dialog-overlay hidden">
        <div class="zork-ticket-dialog">
            <div class="zork-ticket-dialog-header">
                <h3>Create ZORK Ticket</h3>
                <button id="closeZorkTicketDialog" class="zork-ticket-dialog-close">×</button>
            </div>
            <div class="zork-ticket-dialog-content">
                <label for="zorkTicketTitle">Ticket Title:</label>
                <input type="text" id="zorkTicketTitle" class="zork-ticket-input" placeholder="Enter ticket title..." autocomplete="off">
                <label for="zorkTicketDescription">Description (optional):</label>
                <textarea id="zorkTicketDescription" class="zork-ticket-textarea" placeholder="Enter ticket description... (Paste screenshots with Ctrl+V)" rows="4"></textarea>
                <div style="display: flex; gap: 15px; margin-top: 10px;">
                    <div style="flex: 1;">
                        <label for="zorkTicketType">Type:</label>
                        <select id="zorkTicketType" class="zork-ticket-input">
                            <option value="bug">🐛 Bug</option>
                            <option value="feature">✨ Feature</option>
                            <option value="debug">🔍 Debug</option>
                        </select>
                    </div>
                    <div style="flex: 1;">
                        <label for="zorkTicketPriority">Priority:</label>
                        <select id="zorkTicketPriority" class="zork-ticket-input">
                            <option value="1">Low</option>
                            <option value="2" selected>Medium</option>
                            <option value="3">High</option>
                            <option value="4">Critical</option>
                        </select>
                    </div>
                </div>
                <div id="zorkTicketError" class="zork-ticket-error hidden"></div>
            </div>
            <div class="zork-ticket-dialog-buttons">
                <button id="zorkTicketSubmit" class="zork-ticket-btn zork-ticket-btn-primary">Create Ticket</button>
                <button id="zorkTicketCancel" class="zork-ticket-btn zork-ticket-btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Add Context Dialog (for tickets) -->
    <div id="addContextDialog" class="zork-ticket-dialog-overlay hidden">
        <div class="zork-ticket-dialog">
            <div class="zork-ticket-dialog-header">
                <h3>Add Context</h3>
                <button id="closeAddContextDialog" class="zork-ticket-dialog-close">×</button>
            </div>
            <div class="zork-ticket-dialog-content">
                <label for="addContextInput">Add context/feedback (will resubmit ticket to Cursor):</label>
                <textarea id="addContextInput" class="zork-ticket-textarea" placeholder="Paste screenshots with Ctrl+V" rows="6"></textarea>
                <div id="addContextError" class="zork-ticket-error hidden"></div>
            </div>
            <div class="zork-ticket-dialog-buttons">
                <button id="addContextSubmit" class="zork-ticket-btn zork-ticket-btn-primary">Submit</button>
                <button id="addContextCancel" class="zork-ticket-btn zork-ticket-btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Main entry point - ES6 module system -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
